name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 仓库自带检查均为零依赖的纯 node 脚本，无需 npm install
      - name: Syntax check + JP engine regression
        run: npm test
